name: Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Nunca cole `session.enc`, `session.key`, `cache.db`, os diretórios
        `browser-profile/` ou `login-chrome/`, valores de sessão, número de
        conta, CPF, saldos ou lançamentos reais. Eles são a sua conta bancária.
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: E o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Como reproduzir
      placeholder: |
        1. btgpactual sync
        2. btgpactual transactions --installments
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Saída de `btgpactual doctor`
      description: Ela diz qual camada quebrou. Censure valores, nomes e números de conta.
      render: text
  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: btgpactual --version
    validations:
      required: true
